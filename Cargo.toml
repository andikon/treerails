[package]
name = "treerail"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first project and Git worktree explorer"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
toml = "0.9"
toml_edit = "0.23"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true

