[package]
name = "treerail"
default-run = "treerail"
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
description = "A keyboard-first project and Git worktree explorer"
license = "MIT"

[dependencies]
anyhow = "1"
ahp = "=1.0.0"
ahp-types = "=1.0.0"
ahp-ws = "=1.0.0"
github-copilot-sdk = "=1.0.22"
jiff = "0.2"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
portable-pty = "0.9"
vt100 = "0.16"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
toml = "0.9"
toml_edit = "0.23"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
url = "2"
pulldown-cmark = { version = "0.13", default-features = false }
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
strip = true

# Embedded runtime archives make full dependency debug symbols extremely large.
[profile.dev.package.github-copilot-sdk]
debug = false

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

