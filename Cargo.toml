[package]
name = "treerail"
default-run = "treerail"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first project and Git worktree explorer"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
portable-pty = "0.9"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
toml = "0.9"
toml_edit = "0.23"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_System_Memory", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }


