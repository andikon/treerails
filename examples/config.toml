# User-managed preferences only. Runtime memory belongs in state.json beside this file.
project_roots = []
recursive = false
# publication_remote = 'origin'

[worktrees]
path_template = '{project_parent}/{project_name}.worktrees/{branch_slug}'

[agent]
# The SDK's compatible native Copilot runtime is bundled by default.
# runtime = 'C:\Tools\compatible-copilot.exe'
# Optional compatible real CLI frontend; independent of the SDK backend above:
# cli = 'C:\Tools\copilot.exe'
# Override the native AHP host's containing workspace if needed:
# host_directory = 'C:\Code'
# Optional isolated Copilot state, authentication and trust settings:
# home = 'C:\LocalState\treerail-copilot'
# To attach to an already-running compatible local AHP host:
# endpoint = 'ws://127.0.0.1:12345'
# token_env = 'TREERAIL_AHP_TOKEN'

# [[projects]]
# path = 'C:\Code\shop-api'
# path_template = 'D:\Worktrees\shop-api\{branch_slug}'
# publication_remote = 'origin'
